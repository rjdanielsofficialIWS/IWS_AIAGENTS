<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="35%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="55%" stop-color="#0b0b0b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8F6B1E"/>
      <stop offset="40%" stop-color="#C8A24A"/>
      <stop offset="75%" stop-color="#E3C36A"/>
      <stop offset="100%" stop-color="#A77D27"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="320" cy="160" r="260" fill="rgba(200,162,74,0.12)"/>
  <circle cx="940" cy="520" r="320" fill="rgba(200,162,74,0.08)"/>

  <!-- Shield Icon -->
  <g transform="translate(120,140)">
    <path
      d="M160 10
         C220 40 275 47 320 60
         V220
         C320 300 250 360 160 420
         C70 360 0 300 0 220
         V60
         C45 47 100 40 160 10 Z"
      fill="none"
      stroke="url(#gold)"
      stroke-width="16"
      filter="url(#glow)"
    />
    <path
      d="M160 40
         C210 66 250 73 280 84
         V216
         C280 280 225 325 160 370
         C95 325 40 280 40 216
         V84
         C70 73 110 66 160 40 Z"
      fill="#0b0b0b"
      stroke="url(#gold)"
      stroke-width="7"
      opacity="0.92"
    />
    <text
      x="160" y="205"
      text-anchor="middle"
      font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial"
      font-size="86"
      font-weight="900"
      letter-spacing="6"
      fill="url(#gold)"
    >IWS</text>
  </g>

  <!-- Text -->
  <text x="520" y="285"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial"
    font-size="64"
    font-weight="900"
    fill="#ffffff">
    Infinite Wealth Solutions
  </text>

  <text x="520" y="345"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial"
    font-size="34"
    font-weight="800"
    fill="url(#gold)"
    letter-spacing="2">
    AI
  </text>

  <text x="520" y="410"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial"
    font-size="34"
    font-weight="700"
    fill="rgba(255,255,255,0.78)">
    Try our AI Phone Agent
  </text>

  <rect x="520" y="438" width="520" height="4" rx="2" fill="url(#gold)" opacity="0.55"/>
</svg>