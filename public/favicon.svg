<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="20%" stop-color="#FEE101"/>
      <stop offset="50%" stop-color="#A67C00"/>
      <stop offset="80%" stop-color="#FEE101"/>
      <stop offset="100%" stop-color="#8A6D3B"/>
    </linearGradient>

    <radialGradient id="shieldInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <path d="M256 40 L420 100 V280 C420 380 340 440 256 480 C172 440 92 380 92 280 V100 Z" 
        fill="url(#shieldInner)" stroke="#444" stroke-width="2"/>
  
  <path d="M256 55 L405 110 V275 C405 365 330 425 256 465 C182 425 107 365 107 275 V110 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="4,2"/>

  <path d="M256 80 L370 125 V260 C370 330 310 380 256 415 C202 380 142 330 142 260 V125 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <path id="topCurve" d="M160 160 Q256 110 352 160" fill="none" />
  <text font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="url(#goldGrad)">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">INFINITE WEALTH</textPath>
  </text>

  <g filter="url(#goldGlow)">
    <path d="M200 250 C140 250 140 310 200 310 C230 310 280 250 310 250 C370 250 370 310 310 310 C280 310 230 250 200 250" 
          fill="none" stroke="url(#goldGrad)" stroke-width="15" stroke-linecap="round"/>
    <path d="M310 250 L350 210 M350 210 L330 210 M350 210 L350 230" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="210" cy="285" r="10" fill="url(#goldGrad)" />
    <circle cx="260" cy="325" r="10" fill="url(#goldGrad)" />
  </g>

  <path id="bottomCurve" d="M170 350 Q256 410 342 350" fill="none" />
  <text font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="url(#goldGrad)">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">SOLUTIONS</textPath>
  </text>
</svg>